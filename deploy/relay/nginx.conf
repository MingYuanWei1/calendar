# Relay for https://calendar.keydion.com -> Cloudflare Worker (see docs/relay-server.md).
# Install as /etc/nginx/conf.d/calendar-relay.conf, then replace RELAY_SECRET_VALUE
# with the same value stored in the Worker secret RELAY_SECRET.

proxy_cache_path /var/cache/nginx/calendar levels=1:2 keys_zone=calendar_static:20m
                 max_size=1g inactive=7d use_temp_path=off;

upstream calendar_origin {
    server calendar.mingyuanw.workers.dev:443;
    keepalive 32;               # reuse TLS connections to Cloudflare
}

server {
    listen 80;
    listen [::]:80;
    server_name calendar.keydion.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name calendar.keydion.com;

    ssl_certificate     /etc/letsencrypt/live/calendar.keydion.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/calendar.keydion.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 25m;   # image and Excel uploads

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Upstream TLS: send SNI and Host for the Worker's origin hostname.
    proxy_ssl_server_name on;
    proxy_ssl_name calendar.mingyuanw.workers.dev;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_ssl_session_reuse on;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host calendar.mingyuanw.workers.dev;
    # The browser's Origin header (https://calendar.keydion.com) passes through untouched;
    # it must equal APP_ORIGIN for the API's CSRF check.
    proxy_set_header X-Relay-Client-IP $remote_addr;
    proxy_set_header X-Relay-Secret "RELAY_SECRET_VALUE";
    proxy_redirect https://calendar.mingyuanw.workers.dev/ https://calendar.keydion.com/;
    proxy_connect_timeout 10s;
    proxy_read_timeout 120s;    # PDF generation and LLM calls

    # Static assets: cached on the relay. Files are not fingerprinted, so keep the
    # TTL short and revalidate; stale copies are served while refreshing.
    location ~* \.(?:js|css|woff2?|ttf|otf|png|jpe?g|webp|svg|ico)$ {
        proxy_pass https://calendar_origin;
        proxy_cache calendar_static;
        proxy_cache_key $uri;
        proxy_cache_valid 200 10m;
        proxy_cache_revalidate on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        proxy_ignore_headers Set-Cookie;
        proxy_hide_header Set-Cookie;
        add_header X-Relay-Cache $upstream_cache_status always;
    }

    # API, HTML and protected pages: never cached.
    location / {
        proxy_pass https://calendar_origin;
        proxy_buffering off;    # stream downloads/progress straight through
    }
}
