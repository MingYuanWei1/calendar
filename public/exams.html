<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Keydion日历 - 考试安排</title><link rel="icon" type="image/png" href="logo.png"><link rel="stylesheet" href="exams.css?v=rails"><script type="module" src="exams.js?v=title"></script><link rel="stylesheet" href="site-header.css?v=rails"><link rel="stylesheet" href="exams-print.css" media="print"></head><body class="exam-page">
<header id="site-header" class="app-header" data-page="exams"></header><script src="site-header.js?v=menu"></script>
<main class="exam-shell"><p id="notice" role="status"></p>
<div class="exam-layout"><aside class="filters"><label><span data-zh="考试批次" data-en="Exam series">考试批次</span><select id="batch"></select></label><div id="batch-dates" class="muted"></div><h2 data-zh="查看范围" data-en="Show">查看范围</h2><div class="scope-toggle"><button id="all-mode" aria-pressed="true">全部考试</button><button id="mine-mode" aria-pressed="false">我的考试</button></div><button id="import-related" hidden>导入关联考试</button><div id="division-filters"><h2 data-zh="学部" data-en="Division">学部</h2><div id="divisions"></div><label><span data-zh="年级" data-en="Grade">年级</span><select id="grade"></select></label></div></aside>
<section class="schedule-panel"><p id="conflicts" class="warning" hidden></p><div id="schedule" class="schedule" aria-live="polite"></div><footer id="published"></footer></section></div></main>
<dialog id="detail"><div class="dialog-top"><h2 id="detail-title"></h2><button id="close-detail" aria-label="关闭">×</button></div><div id="detail-content" tabindex="0" role="region" aria-labelledby="detail-title"></div></dialog>
<dialog id="pdf-dialog" aria-labelledby="pdf-title"><div class="dialog-top"><h2 id="pdf-title">下载考试表</h2><button id="pdf-close" aria-label="关闭">×</button></div><p id="pdf-description" class="muted"></p><div class="pdf-scope-options"><label><input type="radio" name="pdf-scope" value="all" checked><span id="pdf-all-label">下载全部考试</span></label><label><input type="radio" name="pdf-scope" value="grades"><span id="pdf-grade-label">下载所选年级考试</span></label><section id="pdf-grades" aria-labelledby="pdf-grade-summary" hidden><h3 id="pdf-grade-summary">选择年级（可多选）</h3><div id="pdf-grade-options"></div></section><label><input id="pdf-mine" type="radio" name="pdf-scope" value="mine"><span id="pdf-mine-label">下载我的考试</span></label></div><p id="pdf-error" class="import-errors" role="alert"></p><button id="pdf-submit" class="primary">下载 PDF</button></dialog>
<dialog id="exam-updates" aria-labelledby="exam-updates-title"><h2 id="exam-updates-title"></h2><div id="exam-updates-content"></div><p id="exam-updates-error" role="alert"></p></dialog></body></html>
