<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Keydion日历 - 考试安排</title><link rel="icon" type="image/png" href="logo.png"><link rel="stylesheet" href="exams.css?v=size"><script type="module" src="exams.js?v=size"></script><link rel="stylesheet" href="site-header.css?v=login-note"><link rel="stylesheet" href="site-sidebar.css?v=console-7"><link rel="stylesheet" href="exams-print.css?v=size" media="print"><link rel="stylesheet" href="release-notes.css"><script type="module" src="release-notes-popup.js"></script></head><body class="exam-page">
<link rel="stylesheet" href="assistant.css"><link rel="stylesheet" href="mobile.css?v=language"><header id="site-header" class="app-header" data-page="exams"></header><script src="site-header.js?v=login-note"></script>
<main class="exam-shell"><p id="notice" role="status"></p><div id="mobile-exams" class="mobile-exams mobile-only"></div>
<div class="exam-layout"><aside class="filters" data-site-panel aria-label="考试筛选"><section class="filter-section"><div class="filter-heading"><h2 id="batch-heading" data-zh="考试批次" data-en="Exam series">考试批次</h2></div><select id="batch" aria-labelledby="batch-heading"></select><p id="batch-dates" class="muted filter-note"></p></section><section class="filter-section"><div class="filter-heading"><h2 data-zh="查看范围" data-en="Show">查看范围</h2></div><div class="scope-toggle"><button id="all-mode" aria-pressed="true">全部考试</button><button id="mine-mode" aria-pressed="false">我的考试</button></div><button id="import-related" hidden>导入关联考试</button></section><div id="division-filters"><section class="filter-section"><div class="filter-heading"><h2 data-zh="学部" data-en="Division">学部</h2></div><div id="divisions"></div></section><section class="filter-section"><div class="filter-heading"><h2 id="grade-heading" data-zh="年级" data-en="Grade">年级</h2></div><select id="grade" aria-labelledby="grade-heading"></select></section></div></aside>
<section class="schedule-panel"><p id="conflicts" class="warning" hidden></p><div id="schedule" class="schedule" aria-live="polite"></div><footer id="published"></footer></section></div></main>
<dialog id="detail"><div class="dialog-top"><h2 id="detail-title"></h2><button id="close-detail" aria-label="关闭"><span class="glyph" aria-hidden="true">×</span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></div><div id="detail-content" tabindex="0" role="region" aria-labelledby="detail-title"></div></dialog>
<dialog id="exam-sheet" class="sheet"></dialog>
<dialog id="pdf-dialog" aria-labelledby="pdf-title"><div class="dialog-top"><h2 id="pdf-title">下载考试表</h2><button id="pdf-close" aria-label="关闭">×</button></div><p id="pdf-description" class="muted"></p><div class="pdf-scope-options"><label><input type="radio" name="pdf-scope" value="all" checked><span id="pdf-all-label">下载全部考试</span></label><label><input type="radio" name="pdf-scope" value="grades"><span id="pdf-grade-label">下载所选年级考试</span></label><section id="pdf-grades" aria-labelledby="pdf-grade-summary" hidden><h3 id="pdf-grade-summary">选择年级（可多选）</h3><div id="pdf-grade-options"></div></section><label><input id="pdf-mine" type="radio" name="pdf-scope" value="mine"><span id="pdf-mine-label">下载我的考试</span></label></div><section id="pdf-languages" aria-labelledby="pdf-language-summary"><h3 id="pdf-language-summary">PDF 语言</h3><div class="pdf-language-options"><label class="pdf-grade-option"><input type="radio" name="pdf-lang" value="zh" checked>中文</label><label class="pdf-grade-option"><input type="radio" name="pdf-lang" value="en">English</label></div></section><p id="pdf-error" class="import-errors" role="alert"></p><button id="pdf-submit" class="primary">下载 PDF</button></dialog>
<dialog id="exam-updates" aria-labelledby="exam-updates-title"><h2 id="exam-updates-title"></h2><div id="exam-updates-content"></div><p id="exam-updates-error" role="alert"></p></dialog><script defer src="assistant.js?v=sidebar"></script>
</body></html>
