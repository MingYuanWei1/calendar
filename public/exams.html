<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>考试安排 · 学校校历</title><link rel="stylesheet" href="exams.css"><script type="module" src="exams.js"></script></head><body>
<header class="exam-header"><a class="brand" href="/"><span class="logo">LOGO</span><span><strong>学校校历</strong><small>CAMPUS CALENDAR</small></span></a><nav><a href="/" data-zh="校历" data-en="Calendar">校历</a><a class="active" href="exams.html" data-zh="考试安排" data-en="Exams">考试安排</a></nav><div class="account"><a href="exams-admin.html" data-zh="考试管理" data-en="Manage exams">考试管理</a><button id="language">EN</button><span id="user-name"></span><a id="sign-in" class="button" href="/api/school/login">Microsoft 登录</a><button id="sign-out" hidden>退出登录</button></div></header>
<main class="exam-shell"><div class="page-title"><div><p class="eyebrow">EXAM SCHEDULE</p><h1 data-zh="考试安排" data-en="Exam schedule">考试安排</h1><p class="muted" id="intro">选择学部查看安排，登录后勾选自己要考的场次。</p></div><button id="download" class="primary" disabled>下载 PDF</button></div><p id="notice" role="status"></p>
<div class="exam-layout"><aside class="filters"><label><span data-zh="考试批次" data-en="Exam series">考试批次</span><select id="batch"></select></label><div id="batch-dates" class="muted"></div><h2 data-zh="查看范围" data-en="Show">查看范围</h2><div class="scope-toggle"><button id="all-mode" aria-pressed="true">全部考试</button><button id="mine-mode" aria-pressed="false">我的考试</button></div><div id="division-filters"><h2 data-zh="学部" data-en="Division">学部</h2><div id="divisions"></div><label><span data-zh="年级" data-en="Grade">年级</span><select id="grade"></select></label></div><p class="muted" id="selection-note"></p><p class="muted" id="sso-note"></p></aside>
<section class="schedule-panel"><div class="schedule-toolbar"><h2 id="range"></h2><div><button id="previous" aria-label="上一周">‹</button><button id="current">本批次首周</button><button id="next" aria-label="下一周">›</button></div></div><div class="selection-toolbar"><span id="count" aria-live="polite"></span><div><button id="select-visible">勾选本周</button><button id="clear-visible">取消本周勾选</button></div></div><p id="conflicts" class="warning" hidden></p><div id="schedule" class="schedule" aria-live="polite"></div><footer id="published"></footer></section></div></main>
<dialog id="detail"><div class="dialog-top"><h2 id="detail-title"></h2><button id="close-detail" aria-label="关闭">×</button></div><div id="detail-content"></div></dialog>
<dialog id="pdf-dialog"><form method="dialog"><div class="dialog-top"><h2>下载 PDF / Download PDF</h2><button value="cancel" aria-label="关闭">×</button></div><p>整个考试批次 · Full exam series</p><label><input type="radio" name="pdf-scope" value="all" checked> 当前学部及年级 / Current division and grade</label><label><input id="pdf-mine" type="radio" name="pdf-scope" value="mine"> 我的考试 / My exams</label><p class="muted">仅含考试安排，不含学生名单和座位图。</p><button id="confirm-download" type="button" class="primary">下载 / Download</button></form></dialog>
</body></html>
