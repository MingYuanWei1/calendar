<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>账户管理 · 学校校历</title><link rel="stylesheet" href="exams.css"><link rel="stylesheet" href="site-header.css"><link rel="stylesheet" href="accounts.css"><script type="module" src="accounts.js"></script></head>
<body><header id="site-header" data-page="management"></header><script src="site-header.js"></script>
<main class="exam-shell"><div class="page-title"><div><p class="eyebrow">ACCOUNTS</p><h1 data-zh="账户管理" data-en="Manage accounts">账户管理</h1></div><button id="refresh-accounts" data-zh="刷新" data-en="Refresh">刷新</button></div>
<p id="accounts-notice" role="status"></p>
<div id="accounts-content" hidden><section class="admin-panel"><h2 data-zh="新增账户" data-en="Create account">新增账户</h2><form id="create-account" class="account-create"><label><span data-zh="姓名" data-en="Name">姓名</span><input name="name" required maxlength="160"></label><label><span data-zh="账号" data-en="Username">账号</span><input name="username" required pattern="[a-zA-Z0-9_.\-]{3,64}" minlength="3" maxlength="64" autocomplete="off"></label><label><span data-zh="初始密码（至少 12 位）" data-en="Initial password (12+ characters)">初始密码（至少 12 位）</span><input name="password" type="password" required minlength="12" maxlength="256" autocomplete="new-password"></label><label><span data-zh="角色" data-en="Role">角色</span><select name="role"><option value="1">1 · reader</option><option value="2">2 · moderator</option><option value="3">3 · admin</option></select></label><button class="primary" type="submit" data-zh="创建" data-en="Create">创建</button></form></section>
<section class="admin-panel"><h2 data-zh="所有账户" data-en="All accounts">所有账户</h2><div class="table-scroll"><table><thead><tr><th data-zh="账户" data-en="Account">账户</th><th data-zh="登录方式" data-en="Sign-in method">登录方式</th><th data-zh="角色" data-en="Role">角色</th><th data-zh="启用" data-en="Enabled">启用</th><th data-zh="操作" data-en="Actions">操作</th></tr></thead><tbody id="account-rows"></tbody></table></div></section></div></main></body></html>
