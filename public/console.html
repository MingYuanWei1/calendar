<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Keydion日历 - 管理后台</title><link rel="icon" type="image/png" href="logo.png">
  <link rel="stylesheet" href="console.css?v=brand2">
  <script type="module" src="console.js?v=title"></script>
</head>
<body>
  <div class="console-shell">
    <aside class="console-nav" id="console-nav" aria-label="管理导航"></aside>
    <main class="console-main" id="console-main"><p class="loading">正在加载…</p></main>
  </div>
  <div id="toast" class="toast blueprint" role="status" hidden></div>
  <dialog id="console-dialog" class="dialog blueprint"></dialog>
  <dialog id="preview-dialog" class="dialog blueprint wide"><i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i><div class="dialog-body"><div class="dialog-top"><div class="dialog-title" id="preview-title"></div><button type="button" id="close-preview" class="btn btn-ghost btn-icon" aria-label="关闭"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></div><div id="preview-content"></div></div></dialog>
</body>
</html>
