<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>学校校历</title>
  <link rel="stylesheet" href="calendar.css?v=implementation">
  <link rel="stylesheet" href="admin.css">
  <script defer src="api.js"></script>
  <script defer src="event-details.js"></script>
  <script defer src="calendar.js?v=implementation"></script>
  <script defer src="admin.js"></script>
</head>
<body class="airy">
  <header class="app-header">
    <div class="brand"><div class="logo" aria-label="学校 Logo 占位符">LOGO</div><div><strong data-i18n="school">学校校历</strong><span class="brand-sub">CAMPUS CALENDAR</span></div></div>
    <div class="header-note" data-i18n="publicCalendar">属于每一位同学的校园日程</div>
    <div class="header-actions"><label class="search"><span class="search-label" data-i18n="searchLabel">搜索</span><input id="search" type="search" placeholder="搜索事件" aria-label="搜索事件"></label><button id="admin-entry" type="button">管理事件</button><button id="language" class="language" aria-label="Switch to English">EN</button></div>
  </header>
  <div class="school-tabs" id="school-tabs" aria-label="适用学部"></div>
  <div class="workspace">
    <aside class="sidebar" aria-label="校历筛选">

      <div class="filter-heading"><h2 data-i18n="scope">适用学部</h2><button class="text-button reset" data-i18n="reset">重置</button></div><div id="school-filter"></div>
      <div class="filter-heading"><h2 data-i18n="types">事件类型</h2></div><div id="type-filter"></div>
      <p class="filter-note" data-i18n="scopeNote">选择学部时，同时显示全校事件。</p>
      <div class="side-bottom"><span class="live-dot"></span><span data-i18n="publicNote">公开校历 · 无需登录</span></div>
    </aside>
    <main class="main-calendar" id="main-calendar">
      <div class="calendar-toolbar">
        <div class="month-heading"><span class="editorial-kicker" data-i18n="schoolLife">校园生活 / SCHOOL LIFE</span><h1 id="month-title"></h1></div>
        <div class="calendar-actions"><div class="date-nav"><button id="previous" aria-label="上个月">‹</button><button id="today" data-i18n="today">今天</button><button id="next" aria-label="下个月">›</button></div><div class="view-switch" aria-label="日历视图"><button id="month-view" aria-pressed="true" data-i18n="monthView">月历</button><button id="list-view" aria-pressed="false" data-i18n="listView">日程</button></div></div>
      </div>
      <div class="inline-filters"><label class="school-select-label"><span data-i18n="scope">适用学部</span><select id="school-select" aria-label="适用学部"></select></label><div id="inline-types"></div><button class="text-button reset" data-i18n="reset">重置</button></div>
      <div class="calendar-surface"><div class="weekdays" id="weekdays"></div><div class="month-grid" id="month-grid"></div><div class="agenda" id="agenda" hidden></div><div class="empty" id="empty" hidden><strong data-i18n="emptyTitle">没有符合条件的事件</strong><p data-i18n="emptyHelp">试试其他关键词，或重置筛选。</p><button class="reset" data-i18n="reset">重置</button></div></div>
      <p id="load-status" class="load-status" role="status"></p><button id="retry-load" hidden>重新加载 / Retry</button>
      <div class="calendar-footer"><span id="result-count" aria-live="polite"></span><span data-i18n="timezone">学校当地时间</span></div>
    </main>
    <aside class="details" id="details" aria-label="事件详情"></aside>
  </div>
  <main id="admin-app" hidden></main>
  <dialog id="login-dialog" aria-label="管理员登录"><button id="close-login" class="close-button" aria-label="关闭 / Close">×</button><div id="login-content"></div></dialog>
  <dialog id="media-dialog" aria-labelledby="media-heading"><div class="dialog-top"><h2 id="media-heading">事件海报</h2><button id="close-media" class="close-button" aria-label="关闭图片">×</button></div><img id="media-image" alt="完整事件海报"></dialog>
  <dialog id="preview-dialog" aria-labelledby="preview-heading"><div class="dialog-top"><h2 id="preview-heading">事件预览</h2><button id="close-preview" class="close-button" aria-label="关闭预览">×</button></div><div id="preview-detail"></div></dialog>
  <dialog id="confirm-dialog" aria-labelledby="confirm-heading"><form method="dialog"><h2 id="confirm-heading"></h2><p id="confirm-description"></p><label id="cancel-reason-label" hidden><span id="cancel-reason-text"></span><textarea id="cancel-reason" maxlength="2000"></textarea></label><p id="confirm-error" class="request-error" role="alert"></p><div class="dialog-actions"><button id="confirm-back" value="back">返回</button><button id="confirm-action" value="confirm" class="primary">确认</button></div></form></dialog>
  <dialog id="day-dialog" aria-labelledby="day-title"><div class="dialog-top"><div><span class="overline" data-i18n="dayEvents">当天事件</span><h2 id="day-title"></h2></div><button id="close-day" class="close-button" aria-label="关闭当天事件">×</button></div><div id="day-events"></div></dialog>
  <dialog id="registration-dialog" aria-labelledby="registration-title"><div class="dialog-top"><h2 id="registration-title" data-i18n="registrationPreview">报名入口示意</h2><button id="close-registration" class="close-button" aria-label="关闭">×</button></div><p data-i18n="registrationNotice">正式发布时，此处打开管理员填写的外部报名表。当前设计稿未连接真实表单。</p><button id="registration-ok" class="primary" data-i18n="understood">知道了</button></dialog>
</body>
</html>
